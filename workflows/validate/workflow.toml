# Validate workflow: agentic validation station that executes the validation
# plan using real tools (shell, curl, browser) and produces evidence artifacts.

[workflow]
name              = "validate"
version           = "1"
description       = """
Execute the validation plan produced by the plan workflow using an agentic
claude CLI runner. The agent uses shell, curl, and browser tools to run
real scenarios against the implementation. Reads .validation/ project
conventions if present. Writes evidence.md and evidence.json with
terminal_state VALIDATED or FAILED_VALIDATION.
"""
agent_description = "Execute the validation plan and produce evidence.md + evidence.json."
graph             = "graph.dot"

[inputs.task_packet]
type        = "string"
required    = true
description = "The task packet produced by plan."

[inputs.validation_plan]
type        = "string"
required    = false
description = "Validation plan produced by plan."

[inputs.validation_command]
type        = "string"
required    = false
description = "Shell command or multiline shell script to run as the validation check in the current workspace."

[inputs.target]
type        = "string"
required    = false
description = "Human-readable target being validated: worktree path, run id, branch, patch path, or PR."

[outputs."evidence.md"]
type        = "path"
description = "Human-readable validation evidence and residual risk."
path        = "evidence.md"

[outputs."evidence.json"]
type        = "path"
description = "Structured validation status and command result."
path        = "evidence.json"

[side_effects]
mutates_git    = false
writes_files   = true
network_egress = false
idempotent     = false

[defaults]
labels = { workflow = "validate" }
