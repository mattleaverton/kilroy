# Implement workflow: public iterative coding loop with mixed provider
# routing. Consumes the task packet produced by `plan`, then loops
# planner/coder/critic/status until complete or capped.

[workflow]
name              = "implement"
version           = "1"
description       = """
Iterative coding loop with four roles handed off in sequence:
- planner   (anthropic SDK, sonnet 4.6) reads task packet + prior feedback, scopes one sub-task.
- coder     (opencode + kimi-k2.5)      implements the task, attempts a build.
- critic    (codex CLI + gpt-5.4-mini)  judges work against spec, writes feedback + decision.
- status    (quick_easy class)          writes STATUS.md for external monitoring.

Loop bound: 20 iterations or until critic writes COMPLETE to .kilroy/decision.md.
"""
agent_description = "Implement a task packet with planner/coder/critic/status loop. Monitor STATUS.md while it runs; read result.md and implementation.patch when done."
graph             = "graph.dot"

[inputs.task_packet]
type        = "string"
required    = true
description = "Task packet produced by the plan workflow."

[inputs.testing_plan]
type        = "string"
required    = false
description = "Testing plan produced by the plan workflow."

[inputs.validation_plan]
type        = "string"
required    = false
description = "Validation plan produced by the plan workflow."

[inputs.context_files]
type        = "string"
required    = false
description = "Newline-separated absolute paths the agents should read for additional context."

[inputs.setup_command]
type        = "string"
required    = false
description = "Optional shell command or multiline shell script to prepare the isolated worktree before coding. Use only when authorized by the task packet or rules of engagement."

[inputs.verify_command]
type        = "string"
required    = false
description = "Shell command or multiline shell script run after each coder iteration. If omitted, Kilroy infers from package scripts or Go files."

[outputs.result]
type        = "path"
description = "Final summary written when the loop terminates (success or failure)."
path        = "result.md"

[outputs."implementation.patch"]
type        = "path"
description = "Git diff capturing the implementation against the launch HEAD."
path        = "implementation.patch"

[outputs.status]
type        = "path"
description = "Live status overview, refreshed every iteration. Safe for external readers to poll."
path        = "STATUS.md"

[side_effects]
mutates_git    = true
writes_files   = true
network_egress = true
idempotent     = false

[defaults]
labels = { workflow = "implement" }
