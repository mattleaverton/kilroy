# Implement workflow: stage context, run agent (class=hard_coding), verify
# build+test, write a summary. Dogfood workhorse for kilroy's own v2 work.
#
# NOTE: this manifest uses the LEGACY workflow.toml shape (single top-level
# fields + [[inputs]] array) for compatibility with the existing package
# loader. Block 2 will introduce the v2 manifest schema (per plan §5.2:
# [workflow] / [inputs.<name>] / [outputs.<name>] / [side_effects] /
# [nodes.<id>] tables) and re-author this manifest in the new shape. The
# v2 fields are documented in comments below for forward reference.

name        = "implement"
description = "Implement a directed change with build+test verification."
version     = "1"

outputs = ["result.md"]

[[inputs]]
name        = "prompt"
description = "What to implement. Tightly scoped and specific."
required    = true

[[inputs]]
name        = "context_files"
description = "Newline-separated absolute paths the agent should read for context. Optional."
required    = false

[[inputs]]
name        = "verify_command"
description = "Shell command run by the verify stage. Default builds and runs targeted tests."
required    = false

[[inputs]]
name        = "scope_directive"
description = "Hard scope guardrail rendered into the agent's prompt. Optional."
required    = false

[defaults]
labels = { workflow = "implement" }

