# Investigate workflow: research a focused question and write structured
# notes to result.md. Class=deep_investigation drives long-context routing
# via Step 4b. Idempotent and read-only — no code changes are made.
#
# Sibling of implement and fix; together the trio carves up understanding
# (investigate), evaluation (review, pending), transformation (implement
# and its v0.1 fix variant).
#
# NOTE: legacy workflow.toml shape (single top-level fields + [[inputs]]).
# Block 2 will re-author in the v2 schema (per plan §5.2).

name        = "investigate"
description = "Research a focused question; produce a structured result.md."
version     = "1"

outputs = ["result.md"]

[[inputs]]
name        = "question"
description = "What you're trying to find out. Be specific: what would a complete answer look like?"
required    = true

[[inputs]]
name        = "context_files"
description = "Newline-separated paths the agent should read for context. Optional."
required    = false

[[inputs]]
name        = "urls"
description = "Newline-separated URLs the agent should fetch and analyze. Optional."
required    = false

[[inputs]]
name        = "scope_directive"
description = "Hard scope guardrail rendered into the agent's prompt. Optional."
required    = false

[defaults]
labels = { workflow = "investigate" }

# v2 (Block 2) preview — these declarations will move into [workflow] /
# [side_effects] / [nodes.agent] tables once the new manifest schema lands.
