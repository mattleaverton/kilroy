# Investigate workflow: research a focused question and write structured
# notes to result.md. Class=deep_investigation drives long-context routing
# via Step 4b. Idempotent and read-only — no code changes are made.

[workflow]
name              = "investigate"
version           = "1"
description       = """
Research a focused question. The agent reads context files and URLs
(when provided), distinguishes evidence from inference, and produces
result.md with TL;DR, findings, open questions, and methodology.
"""
agent_description = "Research a question and produce structured findings in result.md."
default_class     = "deep_investigation"
graph             = "graph.dot"

[inputs.question]
type        = "string"
required    = true
description = "What you're trying to find out. Be specific: what would a complete answer look like?"

[inputs.context_files]
type        = "string"
required    = false
description = "Newline-separated paths the agent should read for context."

[inputs.urls]
type        = "string"
required    = false
description = "Newline-separated URLs the agent should fetch and analyze."

[inputs.scope_directive]
type        = "string"
required    = false
description = "Hard scope guardrail rendered into the agent's prompt."

[outputs.result]
type        = "path"
description = "Structured research output (TL;DR, findings, open questions, methodology)."
path        = "result.md"

[side_effects]
mutates_git    = false
writes_files   = true
network_egress = true
idempotent     = true

[nodes.agent]
class = "deep_investigation"

[defaults]
labels = { workflow = "investigate" }
